name: Build Powerwall 3 Docker Image

on:
  push:
    branches: [copilot/fix-dd04be6a-cb41-496f-8a41-e2dbaa9eceb4]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/homeassistant-powerwall3:latest
            ghcr.io/${{ github.repository_owner }}/homeassistant-powerwall3:${{ github.sha }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-homeassistant-base:2025.09.3
            BUILD_ARCH=amd64
